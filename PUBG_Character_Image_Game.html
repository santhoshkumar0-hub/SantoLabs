<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>PUBG Style 3D Noob Runner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020304;
    font-family:Arial,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

button{
    border:0;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(
        #526b83 0%,
        #263644 35%,
        #10151a 65%,
        #050607 100%
    );
}

#sun{
    position:absolute;
    width:150px;
    height:150px;
    top:7%;
    left:50%;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(
        circle,
        #fff 0%,
        #ffd27a 20%,
        rgba(255,170,60,.2) 55%,
        transparent 70%
    );
    filter:blur(2px);
}

#world{
    position:absolute;
    inset:0;
    perspective:800px;
    perspective-origin:50% 32%;
    overflow:hidden;
}

#road{
    position:absolute;
    left:50%;
    top:-20%;
    width:min(760px,125vw);
    height:130%;
    transform:translateX(-50%) rotateX(59deg);
    transform-origin:50% 0;

    background:repeating-linear-gradient(
        to bottom,
        #303338 0,
        #303338 45px,
        #292c31 46px,
        #292c31 90px
    );

    border-left:12px solid #111;
    border-right:12px solid #111;

    box-shadow:
        0 0 80px #000,
        inset 0 0 60px #000;
}

#road::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:7px;
    height:100%;
    transform:translateX(-50%);

    background:repeating-linear-gradient(
        to bottom,
        #ddd 0,
        #ddd 65px,
        transparent 65px,
        transparent 125px
    );

    opacity:.45;
}

.tree{
    position:absolute;
    width:45px;
    height:90px;
    z-index:5;
    transform-origin:bottom;
}

.tree::before{
    content:"";
    position:absolute;
    left:16px;
    bottom:0;
    width:12px;
    height:48px;
    background:#49311e;
}

.tree::after{
    content:"";
    position:absolute;
    left:-5px;
    top:0;
    width:55px;
    height:55px;
    border-radius:50%;

    background:radial-gradient(
        circle at 35% 30%,
        #6c9a48,
        #31562a 65%,
        #162516
    );

    box-shadow:0 0 15px #172516;
}

.tree1{
    left:3%;
    top:25%;
    transform:scale(.8);
}

.tree2{
    right:4%;
    top:28%;
    transform:scale(.7);
}

.tree3{
    left:8%;
    top:48%;
    transform:scale(.55);
}

.tree4{
    right:8%;
    top:50%;
    transform:scale(.6);
}

/* PLAYER */

#player{
    position:absolute;
    z-index:80;
    left:25%;
    bottom:90px;
    width:100px;
    height:155px;

    transform:translateX(-50%);

    transition:
        left .13s ease-out,
        bottom .2s ease-out;
}

#human{
    position:absolute;
    left:50%;
    top:50%;
    width:60px;
    height:145px;

    transform:translate(-50%,-50%);
    transform-style:preserve-3d;

    filter:drop-shadow(
        0 18px 10px rgba(0,0,0,.9)
    );
}

/* HEAD */

.head{
    position:absolute;
    left:50%;
    top:0;
    width:31px;
    height:34px;

    transform:translateX(-50%) translateZ(15px);

    border-radius:50% 50% 45% 45%;

    background:radial-gradient(
        circle at 35% 25%,
        #f3c29d,
        #b87550 65%,
        #69351f
    );

    border:2px solid #3d2115;
}

.head::before{
    content:"";
    position:absolute;
    left:-3px;
    top:-5px;
    width:35px;
    height:16px;

    border-radius:60% 60% 20% 20%;

    background:linear-gradient(
        #4e5a50,
        #202620
    );

    border:2px solid #111;
}

/* BODY */

.body{
    position:absolute;
    left:50%;
    top:31px;
    width:44px;
    height:57px;

    transform:translateX(-50%) translateZ(7px);

    border-radius:12px 12px 8px 8px;

    background:linear-gradient(
        90deg,
        #111,
        #394239 45%,
        #111
    );

    border:2px solid #4b554c;

    box-shadow:
        inset 5px 0 8px rgba(255,255,255,.1);
}

.body::before{
    content:"";
    position:absolute;
    left:7px;
    top:6px;
    width:26px;
    height:42px;

    border-radius:5px;

    background:repeating-linear-gradient(
        to bottom,
        #485148 0,
        #485148 7px,
        #202520 8px,
        #202520 13px
    );
}

/* ARMS */

.arm{
    position:absolute;
    top:39px;
    width:14px;
    height:53px;

    border-radius:10px;

    background:linear-gradient(
        90deg,
        #111,
        #555,
        #111
    );

    transform-origin:top center;
}

.arm.left{
    left:3px;
    animation:armL .3s infinite alternate;
}

.arm.right{
    right:3px;
    animation:armR .3s infinite alternate;
}

/* LEGS */

.leg{
    position:absolute;
    top:83px;
    width:17px;
    height:55px;

    border-radius:9px;

    background:linear-gradient(
        90deg,
        #111,
        #444,
        #111
    );

    transform-origin:top center;
}

.leg.left{
    left:11px;
    animation:legL .3s infinite alternate;
}

.leg.right{
    right:11px;
    animation:legR .3s infinite alternate;
}

.leg::after{
    content:"";
    position:absolute;
    bottom:-5px;
    width:25px;
    height:11px;
    border-radius:8px;
    background:#050505;
}

.leg.left::after{
    left:-6px;
}

.leg.right::after{
    right:-6px;
}

@keyframes legL{
    from{transform:rotate(25deg)}
    to{transform:rotate(-25deg)}
}

@keyframes legR{
    from{transform:rotate(-25deg)}
    to{transform:rotate(25deg)}
}

@keyframes armL{
    from{transform:rotate(-35deg)}
    to{transform:rotate(35deg)}
}

@keyframes armR{
    from{transform:rotate(35deg)}
    to{transform:rotate(-35deg)}
}

#player.jumping{
    bottom:235px;
}

#player.jumping #human{
    transform:
        translate(-50%,-50%)
        rotateX(-5deg);
}

#player.sliding{
    bottom:90px;
}

#player.sliding #human{
    transform:
        translate(-50%,-20%)
        rotateZ(-8deg)
        scaleY(.65);
}

/* OBJECTS */

.object{
    position:absolute;
    z-index:50;
    top:0;

    transform:
        translateX(-50%)
        scale(.2);

    will-change:transform;
}

.ammo{
    width:48px;
    height:32px;
    border-radius:5px;

    background:linear-gradient(
        #68705d,
        #252a25
    );

    border:2px solid #aaa;

    box-shadow:
        0 0 20px rgba(255,200,50,.7);
}

.ammo::before{
    content:"AMMO";
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:bold;
    color:#fff;
}

.bullet{
    width:13px;
    height:40px;

    border-radius:
        8px 8px 3px 3px;

    background:linear-gradient(
        90deg,
        #6b4d24,
        #ffd66b,
        #9b702c
    );

    box-shadow:
        0 0 16px #ffc928;
}

.bullet::after{
    content:"";

    position:absolute;
    top:-6px;
    left:1px;

    width:11px;
    height:12px;

    border-radius:50% 50% 30% 30%;

    background:#ddd;
}

.obstacle{
    width:70px;
    height:70px;

    border-radius:8px;

    background:linear-gradient(
        135deg,
        #9b2c2c,
        #351313
    );

    border:3px solid #d55;

    box-shadow:
        0 0 20px rgba(255,50,50,.6);
}

.obstacle::before{
    content:"!";
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:35px;
    font-weight:900;
}

/* HUD */

#top{
    position:absolute;
    z-index:120;

    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.box{
    padding:8px 12px;

    border-radius:10px;

    background:rgba(4,6,8,.85);

    border:1px solid #59635a;

    font-size:11px;
}

#connection{
    color:#22c55e;
}

.rankButton{
    padding:9px 14px;

    border-radius:10px;

    background:linear-gradient(
        135deg,
        #f59e0b,
        #b45309
    );
}

#hud{
    position:absolute;
    z-index:120;

    top:62px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    gap:6px;
}

.hud{
    min-width:82px;

    text-align:center;

    padding:7px;

    border-radius:9px;

    background:rgba(5,7,8,.88);

    border:1px solid #56605a;
}

.hud small{
    color:#999;
    font-size:9px;
}

.hud b{
    display:block;
    font-size:16px;
}

/* CONTROLS */

#controls{
    position:absolute;
    z-index:130;

    left:0;
    right:0;
    bottom:15px;

    display:flex;
    justify-content:space-around;
}

.control{
    width:68px;
    height:55px;

    border-radius:15px;

    background:rgba(8,10,10,.9);

    border:1px solid #727a72;

    font-size:22px;

    touch-action:manipulation;
}

.control:active{
    transform:scale(.9);
    background:#455046;
}

/* SCREENS */

.screen{
    position:absolute;
    z-index:300;

    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(1,3,4,.95);
}

.panel{
    width:min(430px,90%);

    padding:30px;

    border-radius:20px;

    text-align:center;

    background:linear-gradient(
        145deg,
        #182019,
        #080a08
    );

    border:1px solid #677267;

    box-shadow:
        0 0 40px rgba(0,0,0,.9);
}

.title{
    font-size:30px;
    font-weight:1000;
    margin-bottom:10px;
    color:#d8e0d8;
}

.subtitle{
    color:#999;
    margin-bottom:22px;
}

.modeButton{
    width:100%;
    padding:15px;
    margin-top:10px;

    border-radius:12px;

    background:linear-gradient(
        135deg,
        #526252,
        #202820
    );

    font-size:16px;
}

.smallButton{
    width:100%;
    padding:12px;
    margin-top:10px;

    border-radius:10px;

    background:#202520;
}

.hidden{
    display:none!important;
}

/* RANK */

.progress{
    height:12px;
    margin:15px 0;

    border-radius:20px;

    background:#222;

    overflow:hidden;
}

#expBar{
    width:0;
    height:100%;

    background:linear-gradient(
        90deg,
        #7f8f7f,
        #d5b45a
    );
}

.stat{
    margin:8px;
    color:#ccc;
}

@media(max-width:600px){

    #road{
        width:130vw;
    }

    #player{
        width:82px;
        height:135px;
    }

    .hud{
        min-width:70px;
    }

    .control{
        width:62px;
        height:52px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="sun"></div>

    <div id="world">

        <div id="road">

            <div class="tree tree1"></div>
            <div class="tree tree2"></div>
            <div class="tree tree3"></div>
            <div class="tree tree4"></div>

        </div>

        <div id="player">

            <div id="human">

                <div class="head"></div>
                <div class="body"></div>

                <div class="arm left"></div>
                <div class="arm right"></div>

                <div class="leg left"></div>
                <div class="leg right"></div>

            </div>

        </div>

    </div>

    <div id="top">

        <div class="box" id="connection">
            ● OFFLINE READY
        </div>

        <button
            type="button"
            class="rankButton"
            onclick="openRank()">
            🏆 RANK
        </button>

    </div>

    <div id="hud">

        <div class="hud">
            <small>DISTANCE</small>
            <b id="score">0</b>
        </div>

        <div class="hud">
            <small>AMMO</small>
            <b id="ammo">0</b>
        </div>

        <div class="hud">
            <small>EXP</small>
            <b id="liveExp">0</b>
        </div>

    </div>

    <div id="controls">

        <button type="button" class="control" onclick="moveLeft()">⬅️</button>
        <button type="button" class="control" onclick="jump()">⬆️</button>
        <button type="button" class="control" onclick="slide()">⬇️</button>
        <button type="button" class="control" onclick="moveRight()">➡️</button>

    </div>

    <!-- START -->

    <div id="startScreen" class="screen">

        <div class="panel">

            <div class="title">
                PUBG STYLE RUNNER
            </div>

            <div class="subtitle">
                OFFLINE • 3D • NOOB MODE
            </div>

            <button
                type="button"
                class="modeButton"
                onclick="startGame()">
                ▶️ START RUN
            </button>

            <button
                type="button"
                class="smallButton"
                onclick="openRank()">
                🏆 VIEW RANK
            </button>

        </div>

    </div>

    <!-- GAME OVER -->

    <div id="gameOver" class="screen hidden">

        <div class="panel">

            <div class="title">
                RUN OVER
            </div>

            <div class="stat">
                Distance:
                <b id="finalScore">0</b>
            </div>

            <div class="stat">
                Ammo:
                <b id="finalAmmo">0</b>
            </div>

            <div class="stat">
                EXP:
                <b id="earnedExp">0</b>
            </div>

            <button
                type="button"
                class="modeButton"
                onclick="startGame()">
                🔄 PLAY AGAIN
            </button>

            <button
                type="button"
                class="smallButton"
                onclick="goHome()">
                🏠 HOME
            </button>

        </div>

    </div>

    <!-- RANK -->

    <div id="rankModal" class="screen hidden">

        <div class="panel">

            <div style="font-size:48px">
                🏆
            </div>

            <div class="title">
                <span id="rankName">BRONZE I</span>
            </div>

            <div class="stat">
                EXP:
                <b id="rankExp">0</b>
            </div>

            <div class="progress">
                <div id="expBar"></div>
            </div>

            <div class="stat">
                High Score:
                <b id="highScore">0</b>
            </div>

            <div class="stat">
                Total Runs:
                <b id="totalGames">0</b>
            </div>

            <div class="stat">
                Total Ammo:
                <b id="totalAmmo">0</b>
            </div>

            <button
                type="button"
                class="smallButton"
                onclick="closeRank()">
                CLOSE
            </button>

            <button
                type="button"
                class="smallButton"
                onclick="resetCareer()">
                ♻️ RESET RANK
            </button>

        </div>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CAREER
========================================================= */

const SAVE_KEY = "
